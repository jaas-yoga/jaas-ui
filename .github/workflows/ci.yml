name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  # jaas-skills and jaas-guardrails are separate public repos this app talks
  # to over HTTP in local dev (see run.sh) — draft validate/publish call out
  # to both, so real E2E coverage needs both running alongside this app, not
  # just this repo's own code. Kept as its own job (not folded into
  # lint-test) since it's materially slower.
  e2e:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jaas-ui
      - uses: actions/checkout@v4
        with:
          repository: jaas-yoga/jaas-skills
          path: jaas-skills
      - uses: actions/checkout@v4
        with:
          repository: jaas-yoga/jaas-guardrails
          path: jaas-guardrails
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: jaas-ui/package-lock.json
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11

      - name: Install jaas-ui dependencies
        working-directory: jaas-ui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: jaas-ui
        run: npx playwright install --with-deps chromium
      - name: Sync jaas-skills dependencies
        working-directory: jaas-skills
        run: uv sync
      - name: Sync jaas-guardrails dependencies
        working-directory: jaas-guardrails
        run: uv sync

      - name: Start the stack (web + api + guardrails)
        working-directory: jaas-ui
        env:
          JAAS_DEV_LOGIN_PASSWORD: ${{ secrets.CI_DEV_LOGIN_PASSWORD }}
          AUTH_URL: http://localhost:3027
          AUTH_SECRET: ${{ secrets.CI_DEV_LOGIN_PASSWORD }}
          JAAS_API_URL: http://127.0.0.1:8027
        run: ./run.sh start

      - name: Wait for the stack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8027/api/v1/skills >/dev/null \
              && curl -sf http://localhost:3027/login >/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become ready in time" >&2
          exit 1

      - name: Run E2E tests
        working-directory: jaas-ui
        env:
          JAAS_DEV_LOGIN_PASSWORD: ${{ secrets.CI_DEV_LOGIN_PASSWORD }}
        run: npm run test:e2e

      - name: Stop the stack
        if: always()
        working-directory: jaas-ui
        run: ./run.sh stop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jaas-ui/playwright-report/
          retention-days: 7
